# 2. Builds Configuration
builds:
  - name: kadabra
    git: ../cpp_reference
    compile:
      - args:
          - 'make'
          - 'build'
        workdir: '@THIS_SOURCE_DIR@'
    install:
      - args:
          - 'mkdir'
          - '-p'
          - '@THIS_PREFIX_DIR@/bin'
      - args:
          - 'cp'
          - '@THIS_SOURCE_DIR@/kadabra'
          - '@THIS_PREFIX_DIR@/bin/kadabra'

# 3. Revisions Configuration
revisions:
  - name: 'main-head'
    build_version:
      'kadabra': 'refs/heads/master'

# 4. Parameter Variants & Environments
variants:
  # Thread configuration (via environment variables)
  - axis: 'threads'
    items:
      - name: 't1'
        environ:
          OMP_NUM_THREADS: '1'
          JULIA_NUM_THREADS: '1'
      - name: 't4'
        environ:
          OMP_NUM_THREADS: '4'
          JULIA_NUM_THREADS: '4'
          
  # Top-K vertex selection
  - axis: 'k-val'
    items:
      - name: 'k3'
        extra_args: ['-k', '3']
      - name: 'k10'
        extra_args: ['-k', '10']

  # Graph type (Directed vs Undirected)
  - axis: 'graph-type'
    items:
      - name: 'undirected'
        extra_args: []
      - name: 'directed'
        extra_args: ['-d']

# 5. Define Experiments (C++ binary and Julia driver)
experiments:
  - name: kadabra-cpp
    use_builds: [ kadabra ]
    args:
      - "kadabra"
      - "@EXTRA_ARGS@"
      - "0.01"
      - "0.1"
      - "@INSTANCE@"
    stdout: out

  - name: kadabra-julia
    args:
      - "julia"
      - "compare_kadabra.jl"
      - "@EXTRA_ARGS@"
      - "0.01"
      - "0.1"
      - "@INSTANCE@"
    stdout: out

# 6. Run Matrix (maps instances to directed/undirected flags and parameters)
matrix:
  include:
    # Undirected Graph Benchmarks (No -d flag)
    - experiments: [kadabra-cpp, kadabra-julia]
      instsets: [snap-undirected]
      variants: [undirected, t1, t4, k3, k10]

    # Directed Graph Benchmarks (With -d flag)
    - experiments: [kadabra-cpp, kadabra-julia]
      instsets: [snap-directed]
      variants: [directed, t1, t4, k3, k10]
