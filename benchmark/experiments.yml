# simexpal experiments.yml for KADABRA and BRAVA Benchmarks

# Configure simexpal to use your local Instances directory
instdir: "../Instances"

# 1. Instances
instances:
  - repo: local
    set:
      - TestInstances_Undirected
    subdir: TestInstances
    items:
      - p2p-Gnutella31.txt

  - repo: local
    set:
      - ABCDE_Undirected
    subdir: ABCDE
    items:
      - com-youtube.txt
      - amazon.txt
      - cit-Patents.txt
      - com-lj.txt
      - dblp.txt

  # Only the directed graphs with a currently-correct ground-truth file
  # (see Report appendix "Ground-Truth Correction and Recomputation Time").
  - repo: local
    set:
      - TestInstances_Directed
    subdir: TestInstances
    items:
      - soc-Epinions1.txt
      - soc-Slashdot0902.txt
      - email-EuAll.txt

  # Directed graphs that currently have NO correct ground-truth file: the
  # originally-supplied files were shuffled (moved to
  # Instances/ground_truth/CORRUPT_test_instances/) and have not yet been
  # regenerated, or (soc-LiveJournal1) never had one. Not referenced by any
  # active matrix row below until ground truth is available -- see the
  # TopKTiming_Directed set/matrix entry, whose k=0 runs regenerate ground
  # truth for four of these five graphs.
  - repo: local
    set:
      - TestInstances_Directed_NoGroundTruth
    subdir: TestInstances
    items:
      - web-Google.txt
      - soc-Pokec.txt
      - wiki-topcats.txt
      - wiki-Talk.txt
      - soc-LiveJournal1.txt

  # Subset used for the top-k early-stopping timing experiment (see
  # Report appendix "Top-k Early-Stopping Hypothesis"): the graphs whose
  # ground truth needed regenerating and were too large for exact Brandes.
  - repo: local
    set:
      - TopKTiming_Directed
    subdir: TestInstances
    items:
      - web-Google.txt
      - soc-Pokec.txt
      - wiki-topcats.txt
      - wiki-Talk.txt

# 2. Parameter Variants & Environments
variants:
  - axis: t
    items:
      - name: 't1'
        extra_args: ['--threads', '1']
        environ:
          JULIA_NUM_THREADS: '1'
      - name: 't4'
        extra_args: ['--threads', '4']
        environ:
          JULIA_NUM_THREADS: '4'
      - name: 't8'
        extra_args: ['--threads', '8']
        environ:
          JULIA_NUM_THREADS: '8'
      - name: 't16'
        extra_args: ['--threads', '16']
        environ:
          JULIA_NUM_THREADS: '16'
      - name: 't24'
        extra_args: ['--threads', '24']
        environ:
          JULIA_NUM_THREADS: '24'
      - name: 't32'
        extra_args: ['--threads', '32']
        environ:
          JULIA_NUM_THREADS: '32'
      - name: 't48'
        extra_args: ['--threads', '48']
        environ:
          JULIA_NUM_THREADS: '48'

  - axis: k
    items:
      - name: 'k0' # absolute error
        extra_args: ['-k', '0']
      - name: 'k10'
        extra_args: ['-k', '10']
      - name: 'k100'
        extra_args: ['-k', '100']

  - axis: err
    items:
      - name: 'err01'
        extra_args: ['--epsilon', '0.01', '--delta', '0.1']
      - name: 'err0001'
        extra_args: ['--epsilon', '0.0001', '--delta', '0.1']
  - axis: 'graph-type'
    items:
      - name: 'undirected'
        extra_args: []
      - name: 'directed'
        extra_args: ['-d']

  - axis: 'seed'
    items:
      - name: 'seed0'
        extra_args: ['-s', '0']
      - name: 'seed1'
        extra_args: ['-s', '1']
      - name: 'seed2'
        extra_args: ['-s', '2']

# 3. Define Experiments
experiments:
  - name: kadabra-cpp
    timeout: 43200
    args:
      - "simexpal_runners/run_experiments_cpp"
      - "-i"
      - "@INSTANCE@"
      - "-o"
      - "@OUTPUT:stats.json@"
      - "@EXTRA_ARGS@"
      - "-a"
      - "kadabra"
      - "-v"
      - "cpp"
    stdout: out
    output:
      extensions: ['stats.json']

  - name: kadabra-julia
    timeout: 43200
    args:
      - "julia"
      - "--project=.."
      - "simexpal_runners/run_experiments.jl"
      - "-i"
      - "@INSTANCE@"
      - "-o"
      - "@OUTPUT:stats.json@"
      - "@EXTRA_ARGS@"
      - "-a"
      - "kadabra"
      - "-v"
      - "julia"
    stdout: out
    output:
      extensions: ['stats.json']

  - name: brava-julia
    timeout: 43200
    args:
      - "julia"
      - "--project=.."
      - "simexpal_runners/run_experiments.jl"
      - "-i"
      - "@INSTANCE@"
      - "-o"
      - "@OUTPUT:stats.json@"
      - "@EXTRA_ARGS@"
      - "-a"
      - "brava"
      - "-v"
      - "julia"
    stdout: out
    output:
      extensions: ['stats.json']

  - name: brandes-julia
    timeout: 43200
    args:
      - "julia"
      - "--project=.."
      - "simexpal_runners/run_experiments.jl"
      - "-i"
      - "@INSTANCE@"
      - "-o"
      - "@OUTPUT:stats.json@"
      - "@EXTRA_ARGS@"
      - "-a"
      - "brandes"
      - "-v"
      - "julia"
    stdout: out
    output:
      extensions: ['stats.json']

# 6. Run Matrix
matrix:
  include:
    # Run undirected graphs for kadabra
    # - experiments: [kadabra-cpp, kadabra-julia]
    #   instsets: [TestInstances_Undirected]
    #   variants: [undirected, k0, k10, err1]

    - experiments: [kadabra-cpp, kadabra-julia]
      instsets: [TestInstances_Undirected,ABCDE_Undirected]
      variants: [undirected, k0, k10, k100, err01, err0001, seed0, seed1, seed2]

    # Only covers the 3 directed graphs with valid ground truth right now;
    # see TestInstances_Directed_NoGroundTruth above.
    - experiments: [kadabra-cpp, kadabra-julia]
      instsets: [TestInstances_Directed]
      variants: [directed, k0, k10, k100, err01, err0001, seed0, seed1, seed2]

    # Run undirected graphs for brava
    # - experiments: [brava-julia]
    #   instsets: [TestInstances_Undirected]
    #   variants: [undirected, t1, k0, err1] # brava doesn't use threads/k/err, but we use defaults to satisfy simexpal axes

    # Run undirected graphs for brandes
    # - experiments: [brandes-julia]
    #   instsets: [TestInstances_Undirected]
    #   variants: [undirected, t1, k0, err1, err0001, seed0] # brandes doesn't use threads/k/err/seed, but we use defaults to satisfy simexpal axes

    # # Run directed graphs
    # - experiments: [kadabra-cpp, kadabra-julia, brava-julia]
    #   instsets: [TestInstances_Directed]
    #   variants: [directed, t1, t4, k0, k10, err1]

    # NEW EXPERIMENT: Strong Scaling for Kadabra-Julia
    - experiments: [kadabra-julia]
      instsets: [ABCDE_Undirected]
      variants: [undirected, k0, err0001, seed0, t1, t4, t8, t16, t24, t32, t48]

    # NEW EXPERIMENT: Top-k early-stopping timing at tight epsilon.
    # Single seed only (these graphs are large; see Report appendix).
    # Executed manually (not via `simexpal launch`) to avoid sweeping in
    # the much larger pending TestInstances_Directed matrix row above.
    - experiments: [kadabra-julia]
      instsets: [TopKTiming_Directed]
      variants: [directed, k0, k10, k100, err0001, seed0, t16]
